name: Swift CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (Self-Hosted macOS)
    runs-on: self-hosted
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Show Swift Version
        run: swift --version

      - name: Run Swift Tests (requires full Xcode.app for XCTest)
        run: |
          if [ ! -d "/Applications/Xcode.app" ]; then
            echo "❌ Full Xcode.app not installed at /Applications/Xcode.app."
            exit 1
          fi
          swift test -v

      - name: Build Executable
        run: swift build -c release --product Bitz -v
