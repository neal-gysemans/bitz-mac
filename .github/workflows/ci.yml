name: Swift CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (macOS 15)
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Select Xcode 16 (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16'

      - name: Show Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Run Swift Tests
        run: swift test -v

      - name: Build Executable
        run: swift build -c release --product Bitz -v
