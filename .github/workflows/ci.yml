name: Swift CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (Self-Hosted macOS)
    runs-on: self-hosted
    env:
      SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Show Swift Version
        run: swift --version

      - name: Run Swift Tests (requires full Xcode.app for XCTest)
        run: |
          if [ -d "/Applications/Xcode.app" ]; then
            swift test -v
          else
            echo "⚠️ Full Xcode.app not installed (only CommandLineTools present; XCTest.framework unavailable). Skipping XCTest suite."
          fi

      - name: Build Executable
        run: swift build -c release --product Bitz -v
