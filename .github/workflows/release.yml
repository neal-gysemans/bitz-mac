name: "Release & Distribute"

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.3.1)'
        required: true
        default: 'v1.3.1'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Package & Publish Release
    runs-on: self-hosted
    env:
      SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show Toolchain Versions
        run: swift --version

      - name: Run Swift Test Suite (if Xcode.app installed)
        run: |
          if [ -d "/Applications/Xcode.app" ]; then
            swift test -v
          else
            echo "⚠️ Full Xcode.app not installed (only CommandLineTools present; XCTest.framework unavailable). Skipping XCTest suite."
          fi

      - name: Package Disk Image (DMG)
        run: |
          chmod +x Scripts/create_dmg.sh
          ./Scripts/create_dmg.sh
          test -f build/Bitz.dmg

      - name: Determine Version & Checksum
        id: release_meta
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          VERSION="${TAG#v}"
          SHA256=$(shasum -a 256 build/Bitz.dmg | awk '{print $1}')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION} (Tag: ${TAG})"
          echo "DMG SHA256: ${SHA256}"

      - name: Publish Release to Public Sink (bitz-releases)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISTRIBUTION_TOKEN }}
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          VERSION="${{ steps.release_meta.outputs.version }}"

          cat > /tmp/release-notes.md <<'EOF'
          ## 🚀 Public Beta Quick-Start & Gatekeeper Notice

          **Beta All-Access:** All shipped Bitz Pro features are unlocked at no cost during Public Beta (no license key required).
          Public Beta builds are ad-hoc signed (`codesign --sign -`) without Apple Developer ID notarization (which follows at commercial launch).

          ### Option A: Install via Homebrew (Recommended)
          ```bash
          brew tap akramks/tap
          brew install --cask bitz
          ```
          Update later with `brew upgrade --cask bitz`.

          ### Option B: Direct `.dmg` Download
          1. Download `Bitz.dmg`, open it, and drag **`Bitz.app`** into **`/Applications`** (see `FIRST TIME OPENING - READ ME.txt` inside the DMG).
          2. Because macOS 15 Sequoia+ removed the old right-click → Open shortcut, allow Bitz on first launch using **either** method below (do **not** click *Move to Trash*):
             - **Terminal one-liner:**
               ```bash
               xattr -cr /Applications/Bitz.app
               ```
             - **System Settings (no Terminal):** Double-click `Bitz.app` in `/Applications` once, click Done, then open **System Settings → Privacy & Security → Open Anyway**.

          ### Updating During Beta
          If you use **Meeting Recorder** after updating an ad-hoc Beta build and macOS stops honoring Microphone or Screen & System Audio Recording permissions, toggle them off/on in **System Settings → Privacy & Security** or run `tccutil reset All com.bitz.cybercat`.
          EOF

          echo "Publishing release ${TAG} to AkramKs/bitz-releases..."
          gh release create "${TAG}" \
            --repo "AkramKs/bitz-releases" \
            --title "Bitz v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --generate-notes \
            build/Bitz.dmg

      - name: Update Homebrew Tap Cask
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISTRIBUTION_TOKEN }}
        run: |
          VERSION="${{ steps.release_meta.outputs.version }}"
          SHA256="${{ steps.release_meta.outputs.sha256 }}"

          echo "Updating AkramKs/homebrew-tap Casks/bitz.rb for v${VERSION}..."
          rm -rf /tmp/homebrew-tap
          git clone "https://x-access-token:${GH_TOKEN}@github.com/AkramKs/homebrew-tap.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          cat > Casks/bitz.rb <<'EOF'
          cask "bitz" do
            version "VERSION_PLACEHOLDER"
            sha256 "SHA256_PLACEHOLDER"

            url "https://github.com/AkramKs/bitz-releases/releases/download/v#{version}/Bitz.dmg"
            name "Bitz"
            name "Bitz the Cyber Cat"
            desc "Cyberpunk desktop companion reacting to coding focus and AI agents"
            homepage "https://github.com/AkramKs/bitz-releases"

            depends_on macos: :sonoma

            app "Bitz.app"

            # Bitz's own data only: Application Support/Bitz/Meetings holds the user's recordings and is kept.
            # rmdir removes the Bitz folder only once it is empty.
            zap trash: [
                  "~/Library/Application Support/Bitz/agent-events",
                  "~/Library/Application Support/Bitz/inbox",
                  "~/Library/Preferences/com.bitz.cybercat.plist",
                ],
                rmdir: "~/Library/Application Support/Bitz"

            caveats <<~EOS
              Bitz is currently in free Public Beta and uses ad-hoc code signing
              (Apple Developer ID notarization will follow at commercial launch).

              If macOS Gatekeeper quarantines or blocks Bitz on first launch
              (macOS 15 Sequoia+ removed the right-click -> Open shortcut), run:
                xattr -cr /Applications/Bitz.app
              Or open:
                System Settings -> Privacy & Security -> Open Anyway

              If Meeting Recorder permissions stop working after a Beta update,
              toggle Microphone / Screen Recording off and on in System Settings
              -> Privacy & Security, or reset TCC grants with:
                tccutil reset All com.bitz.cybercat
            EOS
          end
          EOF
          sed -i '' "s/VERSION_PLACEHOLDER/${VERSION}/g" Casks/bitz.rb
          sed -i '' "s/SHA256_PLACEHOLDER/${SHA256}/g" Casks/bitz.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/bitz.rb
          if git diff --staged --quiet; then
            echo "Casks/bitz.rb is already up to date."
          else
            git commit -m "chore(cask): bump bitz to v${VERSION}"
            git push origin main
            echo "Successfully updated and pushed Casks/bitz.rb to AkramKs/homebrew-tap!"
          fi
