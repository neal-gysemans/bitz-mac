name: "Release & Distribute"

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.3.1)'
        required: true
        default: 'v1.3.1'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Package & Publish Release
    runs-on: self-hosted
    env:
      SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show Toolchain Versions
        run: swift --version

      - name: Run Swift Test Suite (if Xcode.app installed)
        run: |
          if [ -d "/Applications/Xcode.app" ]; then
            swift test -v
          else
            echo "⚠️ Full Xcode.app not installed (only CommandLineTools present; XCTest.framework unavailable). Skipping XCTest suite."
          fi

      - name: Package Disk Image (DMG)
        run: |
          chmod +x Scripts/create_dmg.sh
          ./Scripts/create_dmg.sh
          test -f build/Bitz.dmg

      - name: Determine Version & Checksum
        id: release_meta
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          VERSION="${TAG#v}"
          SHA256=$(shasum -a 256 build/Bitz.dmg | awk '{print $1}')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION} (Tag: ${TAG})"
          echo "DMG SHA256: ${SHA256}"

      - name: Publish Release to Public Sink (bitz-releases)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISTRIBUTION_TOKEN }}
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          VERSION="${{ steps.release_meta.outputs.version }}"

          echo "Publishing release ${TAG} to AkramKs/bitz-releases..."
          gh release create "${TAG}" \
            --repo "AkramKs/bitz-releases" \
            --title "Bitz v${VERSION}" \
            --generate-notes \
            build/Bitz.dmg

      - name: Update Homebrew Tap Cask
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISTRIBUTION_TOKEN }}
        run: |
          VERSION="${{ steps.release_meta.outputs.version }}"
          SHA256="${{ steps.release_meta.outputs.sha256 }}"

          echo "Updating AkramKs/homebrew-tap Casks/bitz.rb for v${VERSION}..."
          rm -rf /tmp/homebrew-tap
          git clone "https://x-access-token:${GH_TOKEN}@github.com/AkramKs/homebrew-tap.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          cat > Casks/bitz.rb <<'EOF'
          cask "bitz" do
            version "VERSION_PLACEHOLDER"
            sha256 "SHA256_PLACEHOLDER"

            url "https://github.com/AkramKs/bitz-releases/releases/download/v#{version}/Bitz.dmg"
            name "Bitz"
            name "Bitz the Cyber Cat"
            desc "Cyberpunk desktop companion reacting to coding focus and AI agents"
            homepage "https://github.com/AkramKs/bitz-releases"

            depends_on macos: :sonoma

            app "Bitz.app"

            # Bitz's own data only: Application Support/Bitz/Meetings holds the user's recordings and is kept.
            # rmdir removes the Bitz folder only once it is empty.
            zap trash: [
                  "~/Library/Application Support/Bitz/agent-events",
                  "~/Library/Application Support/Bitz/inbox",
                  "~/Library/Preferences/com.bitz.cybercat.plist",
                ],
                rmdir: "~/Library/Application Support/Bitz"
          end
          EOF
          sed -i '' "s/VERSION_PLACEHOLDER/${VERSION}/g" Casks/bitz.rb
          sed -i '' "s/SHA256_PLACEHOLDER/${SHA256}/g" Casks/bitz.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/bitz.rb
          if git diff --staged --quiet; then
            echo "Casks/bitz.rb is already up to date."
          else
            git commit -m "chore(cask): bump bitz to v${VERSION}"
            git push origin main
            echo "Successfully updated and pushed Casks/bitz.rb to AkramKs/homebrew-tap!"
          fi
